name: docker

# Publica la imagen en GitHub Container Registry (ghcr.io).
#
# Para que existe: el registro oficial de MCP
# (registry.modelcontextprotocol.io) solo acepta metadatos de un paquete que ya
# exista de verdad en npm, PyPI, NuGet, OCI o MCPB. GHCR es el unico registro de
# contenedores donde puedo publicar sin crear una cuenta: usa el GITHUB_TOKEN
# del propio repositorio.
#
# La etiqueta del Dockerfile (`io.modelcontextprotocol.server.name`) es lo que
# el registro oficial lee para comprobar que la imagen y el `name` de
# `server.json` son del mismo dueño.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Etiqueta de version a publicar (debe coincidir con server.json)"
        required: true
        default: "1.0.0"

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tags and labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=${{ inputs.version }},enable=${{ github.event_name == 'workflow_dispatch' }}
            type=raw,value=latest
            type=sha,format=short

      # Antes de publicar se prueba la imagen: si el contenedor no arranca y no
      # responde a la introspeccion, no se sube nada. Es la misma prueba local.
      - name: Build for the test
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: mcp-local-leads:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: MCP handshake inside the container
        run: python tests/test_mcp_docker.py

      - name: Push (amd64 + arm64)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summary
        run: |
          echo "### Imagen publicada" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "${{ steps.meta.outputs.tags }}" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
